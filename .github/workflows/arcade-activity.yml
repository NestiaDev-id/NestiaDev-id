name: Generate Profile Contribution Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write 
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Generate Arcade Contribution Graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: NestiaDev-id
          games: 'pacman,breakout'
          hide_month_labels: 'false'

      - name: Generate Snake Contribution Animation
        uses: Platane/snk@v3
        with:
          github_user_name: NestiaDev-id
          outputs: |
            assets/generated/github-snake.svg
            assets/generated/github-snake-dark.svg?palette=github-dark

      - name: Commit and Push All Generated Animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -d "dist" ]; then
            mv dist/pacman.svg assets/generated/pacman-contribution-graph.svg
            mv dist/breakout.svg assets/generated/pacman-contribution-graph-dark.svg
          fi

          git add assets/generated/pacman-contribution-graph.svg \
                  assets/generated/pacman-contribution-graph-dark.svg \
                  assets/generated/github-snake.svg \
                  assets/generated/github-snake-dark.svg

          if ! git diff --staged --quiet; then
            git commit -m "chore: update contribution animations (Pacman & Snake) 팩맨 🐍"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit for animations."
          fi
